<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DSP self-test</title>
<style>body{font:13px/1.4 ui-monospace,Consolas,monospace;background:#111;color:#ddd;padding:16px}td,th{padding:2px 10px;text-align:right}.bad{color:#f80}.ok{color:#5d5}</style>
</head>
<body>
<h3>DSP self-test (synthetic vowels, offline)</h3>
<div id="out">running…</div>
<script type="module">
import { renderDemo } from './src/demo.js';
import { Analyzer } from './src/dsp/analyzer.js';
import { freqToMidi } from './src/dsp/pitch.js';

const results = {};
const html = [];
for (const fs of [48000, 44100]) {
  for (const voice of ['low', 'high']) {
    const demo = renderDemo(fs, voice);
    const an = new Analyzer(fs);
    const hop = Math.round(fs / 60), N = 4096;
    const rows = demo.vowels.map(() => ({ f0: [], f1: [], f2: [], f3: [], mean: [] }));
    for (let end = N; end <= demo.samples.length; end += hop) {
      const t = end / fs;
      const o = an.process(demo.samples.subarray(end - N, end), null, t);
      const idx = Math.floor(t / demo.segment);
      const local = t - idx * demo.segment;
      if (idx >= demo.vowels.length || local < 0.5 || local > demo.segment - 0.1) continue;
      const r = rows[idx];
      if (o.voiced) r.f0.push(o.midiRaw);
      if (o.midiMean) r.mean.push(o.midiMean);
      if (o.f1) r.f1.push(o.f1);
      if (o.f2) r.f2.push(o.f2);
      if (o.f3) r.f3.push(o.f3);
    }
    const med = (a) => a.length ? [...a].sort((x, y) => x - y)[a.length >> 1] : NaN;
    const errPct = (est, ref) => Math.abs(est - ref) / ref * 100;
    html.push(`<h4>${fs} Hz · ${voice}</h4><table><tr><th>vowel</th><th>note err ¢ (mean)</th><th>F1 est/ref</th><th>F2 est/ref</th><th>F3 est/ref</th><th>F1 cov</th></tr>`);
    const summary = [];
    demo.vowels.forEach((v, i) => {
      const r = rows[i];
      const targetMidi = demo.notes[i] + demo.detune[i] / 100;
      const centsErr = (med(r.mean) - targetMidi) * 100;
      const f1 = med(r.f1), f2 = med(r.f2), f3 = med(r.f3);
      const cls = (e) => e < 12 ? 'ok' : 'bad';
      const cov = (r.f1.length / Math.max(1, r.f0.length) * 100).toFixed(0) + '%';
      html.push(`<tr><td>${v.ipa}</td><td class="${Math.abs(centsErr) < 8 ? 'ok' : 'bad'}">${centsErr.toFixed(1)}</td>` +
        `<td class="${cls(errPct(f1, v.f1))}">${f1.toFixed(0)}/${v.f1}</td>` +
        `<td class="${cls(errPct(f2, v.f2))}">${f2.toFixed(0)}/${v.f2}</td>` +
        `<td class="${cls(errPct(f3, v.f3))}">${f3.toFixed(0)}/${v.f3}</td><td>${cov}</td></tr>`);
      summary.push({ v: v.ipa, centsErr: +centsErr.toFixed(1), f1: Math.round(f1), f2: Math.round(f2), f3: Math.round(f3) });
    });
    html.push('</table>');
    results[`${fs}-${voice}`] = summary;
  }
}
// timing
const fs = 48000, demo = renderDemo(fs, 'low'), an = new Analyzer(fs);
const t0 = performance.now();
for (let k = 0; k < 300; k++) an.process(demo.samples.subarray(10000 + k * 800, 14096 + k * 800), null, k / 60);
const ms = (performance.now() - t0) / 300;
html.push(`<p>avg process(): ${ms.toFixed(2)} ms/frame</p>`);
results.msPerFrame = ms;
document.getElementById('out').innerHTML = html.join('');
window.__results = results;
</script>
</body>
</html>
